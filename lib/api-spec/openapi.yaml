openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Taiwan stock industry analysis
  - name: stock
    description: Per-stock financial data (FinMind)
  - name: outcomes
    description: 前瞻驗證 — 以事後真實走勢檢驗當初存下的交易計畫
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeIndustry
      tags: [analyze]
      summary: 分析台股產業供應鏈
      description: 搜尋近期產業新聞，AI 拆解台股供應鏈核心標的並計算情境期望值
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: 分析結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          description: 請求格式錯誤
        "500":
          description: 分析失敗
  /stock/{code}:
    get:
      operationId: stockDetail
      tags: [stock]
      summary: 單股財務資料（FinMind）
      description: 抓取股價MA、月營收YoY、三大法人30日淨買賣
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: 台股股票代號（如：3324）
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 3m, 6m]
            default: 3m
      responses:
        "200":
          description: 財務資料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDetailResult"
        "500":
          description: 資料抓取失敗
  /stock/{code}/fundamentals:
    get:
      operationId: stockFundamentals
      tags: [stock]
      summary: 財報三表衍生的品質比率（延後載入）
      description: >-
        毛利率、營益率、ROE、負債比與自由現金流的多季趨勢。刻意不放進
        /stock/{code} 的主流程：那裡已有六個 FinMind 請求，再加三張報表
        就是一次分析 27~45 個請求，尖峰會直接打到首次查詢。只有價值與
        存股兩個視圖需要，由前端在切到那些視圖時才請求。
        抓取失敗時回傳空的 quarters 而非 500 —— 個股其餘部分不受影響。
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: 台股股票代號（如：2330）
      responses:
        "200":
          description: 財報品質比率。quarters 為空代表無資料或抓取失敗。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Financials"
  /outcomes:
    post:
      operationId: verifyOutcomes
      tags: [outcomes]
      summary: 前瞻驗證交易計畫
      description: >-
        以事後真實日線走勢，判定每筆計畫的停利與停損哪一個先被觸及。
        用於檢驗未經回測的三情境機率設定是否貼近實際。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOutcomesRequest"
      responses:
        "200":
          description: 驗證結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOutcomesResult"
        "400":
          description: 請求格式錯誤
        "500":
          description: 驗證失敗
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        keyword:
          type: string
          description: 產業關鍵字（例：AI水冷散熱）
        period:
          type: string
          enum: [1m, 3m, 6m]
          description: 分析週期
      required:
        - keyword
        - period
    AnalyzeResult:
      type: object
      properties:
        keyword:
          type: string
        period:
          type: string
        sentiment:
          type: string
          enum: [bullish, neutral, bearish]
          description: 產業綜合情緒
        summary:
          type: string
          description: 產業現況總結
        catalysts:
          type: array
          items:
            type: string
          description: >-
            主要催化劑列表（純文字）。保留供舊版快照相容，新版請用 catalystDetails，
            它額外帶出處。兩者由同一份模型輸出產生，順序一致。
        catalystDetails:
          type: array
          items:
            $ref: "#/components/schemas/SourcedClaim"
          description: >-
            帶出處的催化劑。source 指向 newsItems 的 1 起算索引；
            null 表示模型沒有對應到任何一篇新聞，即該說法屬於模型推論而非報導內容。
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/StockInfo"
          description: 核心供應鏈標的
        newsItems:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
          description: 近期相關新聞
      required:
        - keyword
        - period
        - sentiment
        - summary
        - catalysts
        - stocks
        - newsItems
    SourcedClaim:
      type: object
      properties:
        text:
          type: string
        source:
          type: integer
          nullable: true
          description: >-
            對應的 newsItems 索引（1 起算）。null 代表沒有任何一篇新聞支持此說法 ——
            那是模型依既有知識所做的推論，畫面上必須與有報導根據的內容區分顯示。
      required:
        - text
    StockInfo:
      type: object
      properties:
        code:
          type: string
          description: 股票代號
        name:
          type: string
          description: 公司名稱
        reason:
          type: string
          description: 選入理由
        reasonSource:
          type: integer
          nullable: true
          description: 選入理由的出處（newsItems 的 1 起算索引）；null 表示模型推論
        sector:
          type: string
          description: 所屬次產業
      required:
        - code
        - name
        - reason
        - sector
    NewsItem:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        source:
          type: string
          nullable: true
          description: >-
            讀者認得的媒體名稱（鉅亨網、工商時報…），由網域對照而來。
            網址解析不了時為 null。
        publishedAt:
          type: string
          nullable: true
          description: >-
            發布日期（YYYY-MM-DD）。由文章頁的 article:published_time 或
            ld+json datePublished 讀出 —— Tavily 的一般搜尋不回傳這個欄位。
            抓不到時為 null，畫面即不顯示時間，不以查詢時間充數。
      required:
        - title
        - url
    RevenuePoint:
      type: object
      properties:
        yearMonth:
          type: string
          description: "格式：YYYY/MM"
        revenue:
          type: number
          description: 月營收（新台幣元）
        yoy:
          type: number
          nullable: true
          description: 年增率（%）
      required:
        - yearMonth
        - revenue
    VerifyOutcomeItem:
      type: object
      properties:
        code:
          type: string
        from:
          type: string
          description: 做出這份計畫的日期（YYYY-MM-DD）
        entryLow:
          type: number
        entryHigh:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
      required: [code, from, entryLow, entryHigh, stopLoss, takeProfit]
    VerifyOutcomesRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VerifyOutcomeItem"
          description: 一次最多 40 筆，超過的會被忽略
      required: [items]
    OutcomeKind:
      type: string
      enum: [target, stop, ambiguous, open, no_entry, unknown]
      description: >-
        target=先觸及停利、stop=先觸及停損、
        ambiguous=同一根日線同時觸及兩者（無法判定盤中先後）、
        open=已進場但兩者皆未觸及、no_entry=價格從未進入進場區間、unknown=資料不足
    OutcomeResultItem:
      type: object
      properties:
        code:
          type: string
        from:
          type: string
        kind:
          $ref: "#/components/schemas/OutcomeKind"
        entryDate:
          type: string
          nullable: true
        exitDate:
          type: string
          nullable: true
        barsHeld:
          type: number
          description: 進場後經過的交易日數
        maxFavorablePct:
          type: number
          nullable: true
          description: 進場後最大有利波動（%）
        maxAdversePct:
          type: number
          nullable: true
          description: 進場後最大不利波動（%）
      required: [code, from, kind, barsHeld]
    Returns:
      type: object
      properties:
        d5:
          type: number
          nullable: true
          description: 近 5 個交易日報酬（%）
        d20:
          type: number
          nullable: true
          description: 近 20 個交易日報酬（%）
        d60:
          type: number
          nullable: true
          description: 近 60 個交易日報酬（%）
    MarketContext:
      type: object
      properties:
        return5d:
          type: number
          nullable: true
        return20d:
          type: number
          nullable: true
        return60d:
          type: number
          nullable: true
        maSignal:
          type: string
          enum: [above_both, above_ma20, below_both, insufficient_data]
          description: >-
            加權指數自身的均線位置，判定方式與個股相同。below_both 代表大盤跌破
            雙均線，此時個股停損被觸發的機率上升且會同時發生 —— 畫面上
            「分散五檔」的保護在系統性下跌時並不成立。
        asOf:
          type: string
          nullable: true
          description: 大盤資料的最後日期。與個股未必同步，因此各自標示。
    MetricBand:
      type: object
      properties:
        current:
          type: number
          nullable: true
        percentile:
          type: number
          nullable: true
          description: >-
            目前值高於歷史樣本的百分比（0~100）。第 80 百分位代表過去五年有
            八成的時間比現在便宜。樣本少於 2 筆時為 null —— 一個點構不成區間。
        low:
          type: number
          nullable: true
        median:
          type: number
          nullable: true
        high:
          type: number
          nullable: true
        samples:
          type: number
          description: 實際參與計算的樣本數，讓畫面能標明區間的可信度
      required: [samples]
    Valuation:
      type: object
      properties:
        per:
          $ref: "#/components/schemas/MetricBand"
        pbr:
          $ref: "#/components/schemas/MetricBand"
        dividendYield:
          $ref: "#/components/schemas/MetricBand"
        asOf:
          type: string
          nullable: true
      required: [per, pbr, dividendYield]
    DividendSummary:
      type: object
      properties:
        consecutiveYears:
          type: number
          description: >-
            從最新年度往回數的連續配息年數。不是「有配息的年數」——
            實測 2412 中華電 2009 年缺席，總年數 21 但連續只有 17。
        latestYear:
          type: string
          nullable: true
        latestCash:
          type: number
          nullable: true
          description: 最近一個有配息年度的現金股利合計（季配會有多筆）
        avgCash5y:
          type: number
          nullable: true
        coverageFrom:
          type: string
          nullable: true
          description: 資料涵蓋的最早年度。文案只能寫「N 年起」，不得宣稱完整歷史。
        filled:
          type: number
          description: 填息成功次數
        filledTotal:
          type: number
          description: 可判定的除息次數（缺價位者不計）
      required: [consecutiveYears, filled, filledTotal]
    QuarterMetrics:
      type: object
      properties:
        date:
          type: string
        grossMargin:
          type: number
          nullable: true
        operatingMargin:
          type: number
          nullable: true
        netMargin:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        roe:
          type: number
          nullable: true
          description: 股東權益報酬率（%）。單季值，非年化 —— 畫面必須標明。
        debtRatio:
          type: number
          nullable: true
        fcf:
          type: number
          nullable: true
          description: 自由現金流 = 營運現金流 − 資本支出
      required: [date]
    Financials:
      type: object
      properties:
        quarters:
          type: array
          items:
            $ref: "#/components/schemas/QuarterMetrics"
          description: 由新到舊
        asOf:
          type: string
          nullable: true
          description: 最新一季的財報日期。財報季頻且發布有延遲，畫面必須標示。
      required: [quarters]
    OutcomeTally:
      type: object
      properties:
        target:
          type: number
        stop:
          type: number
        ambiguous:
          type: number
        open:
          type: number
        noEntry:
          type: number
        unknown:
          type: number
        decided:
          type: number
          description: 已分出勝負的筆數（達標＋停損），命中率的分母
        targetRate:
          type: number
          nullable: true
          description: 達標率（%）。尚無已結案筆數時為 null，不以 0% 假裝有結論。
        entered:
          type: number
          description: 真的進場的筆數（達標＋停損＋同日觸及＋仍持有），成立率的分子
        entryRate:
          type: number
          nullable: true
          description: >-
            成立率（%）—— 計畫中有多少比例真的變成交易。達標率的分母排除了未進場的
            計畫，那在統計上正確，但少了這個數字「大部分計畫從未成立」在畫面上
            完全看不見，而它決定這個工具的實用價值。可判定筆數為 0 時為 null。
      required: [target, stop, ambiguous, open, noEntry, unknown, decided, entered]
    VerifyOutcomesResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeResultItem"
        tally:
          $ref: "#/components/schemas/OutcomeTally"
      required: [results, tally]
    Invalidation:
      type: object
      description: >-
        這份計畫在什麼情況下不再成立。價格與時間兩條各自獨立。
      properties:
        priceLevel:
          type: number
          nullable: true
          description: >-
            跌破此價位即失效。已成立的計畫用停損；尚未成立的計畫用近 20 日低點 ——
            停損是由「假設中的進場價」往下推 2 個 ATR 得來的，那個進場價還沒發生，
            拿它當失效線等於用一個不存在的部位的風險上限描述現在的處境。
        priceReason:
          type: string
        expiresAfterTradingDays:
          type: integer
          description: 1m→10、3m→20、6m→30。**經驗值，未經驗證**，畫面必須標示。
        expiryReason:
          type: string
      required: [priceLevel, priceReason, expiresAfterTradingDays, expiryReason]
    StopBasis:
      type: object
      description: >-
        停損的依據。演算法完全沒變 —— 改的只是把算式與結構對照講出來。
        同樣是 115 元，落在近 20 日低點之下與之上，被掃出場的機率完全不同。
        刻意不改用結構性停損：前低是任意選定的結構（為何是 20 日而非 10 或 60？），
        換上去會同時改變風報比與建議張數，卻沒有驗證支撐那個選擇。
      properties:
        method:
          type: string
          enum: [atr_volatility]
        text:
          type: string
          description: 可驗算的算式
        atr:
          type: number
        factor:
          type: number
          description: 時間尺度係數
        reference:
          type: object
          description: 結構對照 —— 停損相對於它們的位置才是重點
          properties:
            swingLow:
              type: number
              nullable: true
            ma20:
              type: number
              nullable: true
      required: [method, text, atr, factor, reference]
    Signal:
      type: object
      description: >-
        一條可顯示的訊號依據。全部由程式規則算出，**不是模型判斷** ——
        Gemini 的呼叫發生在抓取個股資料之前，模型從未看過任何價格數字。
        每一條的 detail 都寫出可驗算的具體數值。
        這些訊號只做顯示，不進入評分公式。
      properties:
        key:
          type: string
          description: >-
            ma_bull_stack／ma_bear_stack／macd_golden／macd_dead／
            kd_golden／kd_dead／kd_overbought／foreign_streak／trust_streak／
            volume_surge／volume_breakout／volume_dry／revenue_growth
        label:
          type: string
        direction:
          type: string
          enum: [bullish, bearish, neutral]
          description: >-
            neutral 用於爆量與量縮 —— 兩者本身都不指向任何一邊，
            爆量可以是突破起漲也可以是高檔出貨。
        detail:
          type: string
      required: [key, label, direction, detail]
    Macd:
      type: object
      properties:
        dif:
          type: number
        dea:
          type: number
        osc:
          type: number
          description: 柱體 = DIF − DEA
        cross:
          type: string
          nullable: true
          enum: [golden, dead]
          description: >-
            僅在最近 3 根內發生交叉時有值。交叉是事件不是狀態 ——
            永遠回報「目前 DIF 在 DEA 之上」會讓三個月前的交叉今天仍顯示為新訊號。
      required: [dif, dea, osc]
    Kd:
      type: object
      properties:
        k:
          type: number
        d:
          type: number
        cross:
          type: string
          nullable: true
          enum: [golden, dead]
      required: [k, d]
    VolumeProfile:
      type: object
      description: 只給 20 日均量無法回答「今天的量算不算異常」，那需要當日量與比值
      properties:
        latest:
          type: number
          description: 最近一個交易日的成交量（股）
        avg5:
          type: number
          nullable: true
        avg20:
          type: number
        ratio:
          type: number
          description: 最新量 ÷ 20 日均量
        kind:
          type: string
          enum: [surge, expanding, normal, shrinking]
          description: surge ≥2×、expanding 1.3~2×、normal 0.7~1.3×、shrinking <0.7×
      required: [latest, avg20, ratio, kind]
    ChipWindows:
      type: object
      description: >-
        同一法人別在四個天期的累積淨買超（股數，可為負）。
        天期以「交易日」計，不是日曆日 —— 資料本身只有開市日，
        用日曆天數切會在連假後少算好幾天。
        資料不足該天期時為 null，不以較少的天數硬湊。
      properties:
        d1:
          type: number
          nullable: true
          description: 最近一個交易日
        d5:
          type: number
          nullable: true
        d10:
          type: number
          nullable: true
        d20:
          type: number
          nullable: true
      required: [d1, d5, d10, d20]
    InvestorChips:
      type: object
      properties:
        windows:
          $ref: "#/components/schemas/ChipWindows"
        streak:
          type: integer
          description: >-
            連續買賣超天數：正數為連買、負數為連賣、0 為最近一日打平或無資料。
            與視窗累積互補 —— 連續 8 天小買和「1 天大買、7 天觀望」的
            5 日累積可能相同，但前者是持續建倉、後者只是一次性調節。
        trend:
          type: string
          enum:
            - accumulating
            - slowing
            - reversing_down
            - distributing
            - easing
            - reversing_up
            - neutral
            - insufficient_data
          description: >-
            以近 5 日相對於近 20 日的力道變化判定。方向是否值得陳述，
            以「淨額佔該期間總成交量的比例」衡量（門檻 2.5%），
            長短天期各自判斷 —— 只用 20 日門檻的話，
            近期的決斷動作會被長天期的平淡蓋掉。
            accumulating=買超且買盤加強、slowing=買超但退潮、
            reversing_down=近5日明顯站在賣方而20日累積並未支持該方向、
            distributing=賣超且賣壓加強、easing=賣超但賣壓減輕、
            reversing_up=近5日明顯站在買方而20日累積並未支持該方向、
            neutral=長短天期參與率都太低、
            insufficient_data=不足20個交易日。
      required: [windows, trend, streak]
    Chips:
      type: object
      description: >-
        三大法人的多天期籌碼。單一 30 日累積會被較久以前的資料稀釋 ——
        前 15 天大買、近 5 天連續調節，累積數字仍是正的，
        卻正好蓋掉最該被看到的轉折。
      properties:
        tradingDays:
          type: integer
          description: 實際取得的交易日數，用於說明為何某些天期為 null
        foreign:
          $ref: "#/components/schemas/InvestorChips"
        trust:
          $ref: "#/components/schemas/InvestorChips"
        dealer:
          $ref: "#/components/schemas/InvestorChips"
      required: [tradingDays, foreign, trust, dealer]
    StockDetailResult:
      type: object
      properties:
        code:
          type: string
        period:
          type: string
          enum: [1m, 3m, 6m]
          description: 本次計算採用的分析週期（未帶參數時為 3m）
        horizonFactor:
          type: number
          description: >-
            時間尺度係數 √(交易日數÷60)。停損、停利、移動停損與三情境幅度
            皆乘上此係數，因此風報比與情境機率不隨週期改變，只有絕對幅度伸縮。
        currentPrice:
          type: number
          nullable: true
        ma20:
          type: number
          nullable: true
        ma60:
          type: number
          nullable: true
        maSignal:
          type: string
          enum: [above_both, above_ma20, below_both, insufficient_data]
        revenueYoY:
          type: number
          nullable: true
          description: 最近月份年增率（%）
        revenueHistory:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
        institutionalNet30d:
          type: number
          description: 三大法人30日合計淨買超（股數）
        foreignNet30d:
          type: number
          description: 外資30日淨買超（股數）
        trustNet30d:
          type: number
          description: 投信30日淨買超（股數）
        dealerNet30d:
          type: number
          description: 自營商30日淨買超（股數）
        chips:
          $ref: "#/components/schemas/Chips"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
          description: 訊號依據。空陣列代表沒有任何條件成立，不是資料缺失。
        trend:
          type: string
          enum: [uptrend, downtrend, range]
          description: >-
            三個條件同時成立才算趨勢：均線相對位置、MA20 斜率、收盤價相對月線。
            其餘一律 range —— 不硬把盤整說成趨勢。
        trendBasis:
          type: string
          description: 趨勢判定的依據，直接寫出四個實際數值供驗算
        macd:
          oneOf:
            - $ref: "#/components/schemas/Macd"
            - type: "null"
        kd:
          oneOf:
            - $ref: "#/components/schemas/Kd"
            - type: "null"
        volume:
          oneOf:
            - $ref: "#/components/schemas/VolumeProfile"
            - type: "null"
        evScore:
          type: number
          description: >-
            綜合評分。實際範圍 -7 到 8（營收 ±3／均線 ±2／外資 ±2／投信 ±0.5／
            籌碼趨勢 ±0.5）。先前文件寫「-7 到 7」是錯的，改版前的真實範圍是
            -6.5 到 7.5。三情境機率的分段門檻是 4／2／0／-2，不依賴此上下限。
        pBull:
          type: number
          nullable: true
          description: 多頭情境機率（0–1）
        pBase:
          type: number
          nullable: true
          description: 基準情境機率（0–1）
        pBear:
          type: number
          nullable: true
          description: 空頭情境機率（0–1）
        rBull:
          type: number
          nullable: true
          description: 多頭情境預期報酬（%）
        rBase:
          type: number
          nullable: true
          description: 基準情境預期報酬（%）
        rBear:
          type: number
          nullable: true
          description: 空頭情境預期報酬（%）
        ev:
          type: number
          nullable: true
          description: >-
            加權期望值 E(V)（%）。算不出波動（停牌、資料抓取失敗、上市未滿 14 個交易日）
            時為 null —— **不得以 0 代替**。0 在排名上勝過任何真的算出負值的標的，
            一檔連收盤價都沒有的股票會因此被排到第一列並印成綠色的 0.00%。
        evSignal:
          type: string
          nullable: true
          enum: [strong_buy, buy, watch_positive, watch_negative, avoid]
          description: 期望值訊號。ev 為 null 時同為 null。
        priceAsOf:
          type: string
          nullable: true
          description: 價格資料的最後交易日（YYYY-MM-DD）
        atr:
          type: number
          nullable: true
          description: 近14日平均真實振幅（元）
        atrPct:
          type: number
          nullable: true
          description: ATR 佔股價百分比，即日均波動率（%）
        entryLow:
          type: number
          nullable: true
          description: 建議進場區間下緣（元）
        entryHigh:
          type: number
          nullable: true
          description: 建議進場區間上緣（元）
        stopLoss:
          type: number
          nullable: true
          description: >-
            停損價，進場中值減 2×ATR×時間尺度係數（元），已取整到合法檔位 ——
            未取整時會出現無法下單的價格（如 1000 元以上個股的 2040.43，該區間檔位為 5 元）。
        takeProfit:
          type: number
          nullable: true
          description: 停利價，進場中值加 多頭倍數×ATR×時間尺度係數（元），已取整到合法檔位
        firstTarget:
          type: number
          nullable: true
          description: >-
            第一目標（1R），與停損等距、已取整到合法檔位。
            達成時建議先出一半。停利落在 1R 以內時為 null（分批出場無意義）。
        riskRewardRatio:
          type: number
          nullable: true
          description: 風險報酬比，(停利−進場)÷(進場−停損)
        riskPerLot:
          type: number
          nullable: true
          description: 每張最大損失（元，1張=1000股）
        rewardPerLot:
          type: number
          nullable: true
          description: 每張目標獲利（元，1張=1000股）
        entryTiming:
          type: string
          enum: [now, wait_pullback, avoid, insufficient_data]
          description: 現價進場時機判斷
        trailingStop:
          type: number
          nullable: true
          description: >-
            移動停損（吊燈出場法）起始值，部位高點減 2.5×ATR×時間尺度係數，只升不降。
            規劃階段的部位高點即進場價，故此值必定低於初始停損，在部位獲利前不會先觸發。
        swingLow:
          type: number
          nullable: true
          description: 近20日最低價，作為停損位置的結構性對照
        swingHigh:
          type: number
          nullable: true
          description: 近20日最高價，作為壓力位置參考
        avgVolume20:
          type: number
          nullable: true
          description: 近20日平均成交量（股）
        returns:
          $ref: "#/components/schemas/Returns"
        relativeStrength:
          allOf:
            - $ref: "#/components/schemas/Returns"
          nullable: true
          description: >-
            個股報酬減大盤同期報酬，單位是百分點。個股漲 8% 而大盤漲 10% 時這裡
            是 -2 —— 絕對值為正、相對大盤卻是輸的，而那正是只看個股均線判不出來
            的事。當日抓不到加權指數時為 null。只做顯示，不進評分。
        market:
          allOf:
            - $ref: "#/components/schemas/MarketContext"
          nullable: true
          description: 當日大盤脈絡。抓不到時為 null，畫面整塊不渲染。
        valuation:
          $ref: "#/components/schemas/Valuation"
        dividend:
          $ref: "#/components/schemas/DividendSummary"
        foreignNetDays:
          type: number
          nullable: true
          description: 外資30日淨買超相當於幾日平均成交量
        trustNetDays:
          type: number
          nullable: true
          description: 投信30日淨買超相當於幾日平均成交量
        stockName:
          type: string
          nullable: true
          description: 官方公司簡稱（證交所／櫃買中心），可用於核對 AI 給的名稱
        officialIndustry:
          type: string
          nullable: true
          description: 官方產業類別（證交所／櫃買中心），與 AI 的次產業描述並列對照
        ruleVersion:
          type: integer
          description: >-
            計算規則版本。快照會存下此值，前瞻驗證的統計才不會把不同規則
            算出來的結果混進同一個達標率裡。
            1=初版（快照中沒有這個欄位者）、2=進場上緣與操作建議修正、
            3=評分改用 20 個交易日籌碼並加入趨勢修正。
        advice:
          type: object
          description: >-
            由交易計畫的價位幾何推出的操作建議。只給列舉值，畫面文字由前端負責。
          properties:
            action:
              type: string
              enum: [can_enter, wait_pullback, wait_breakout, stop_breached, insufficient_data]
              description: >-
                can_enter=現價落在進場區間內、
                wait_pullback=區間在現價之下需等回檔、
                wait_breakout=區間在現價之上需等突破、
                stop_breached=現價已低於停損、
                insufficient_data=缺少必要價位
            planKind:
              type: string
              enum: [immediate, pullback, conditional, none]
              description: >-
                進場區間相對於現價的位置。
                conditional 表示區間在現價之上、計畫尚未成立，畫面必須以
                「站回月線後的計畫」而非「建議買價」陳述那組價位；
                none 表示不得顯示任何價位。
          required:
            - action
            - planKind
        invalidation:
          $ref: "#/components/schemas/Invalidation"
        stopBasis:
          oneOf:
            - $ref: "#/components/schemas/StopBasis"
            - type: "null"
        narrative:
          type: string
          nullable: true
          description: >-
            由已算出的欄位組成的中文摘要。**模板組句，不呼叫任何模型** ——
            因此永遠不會與畫面上的數字牴觸。任一欄位缺席時該段整句略過。
            planKind 為 none 時整段價位不入句，不把畫面剛抑制掉的矛盾用文字重講一次。
        degraded:
          type: array
          items:
            type: string
            enum: [price, revenue, institutional]
          description: >-
            本次沒有抓到、且會影響評分的資料集。空陣列代表評分完整。
            FinMind 免費層一小時 300~600 次，而一次分析五檔就要發二三十個請求 ——
            額度用盡是常態不是例外。少了營收是 ±3 分、少了籌碼是 ±2.5 分，
            evScore 可能從 5.5 掉到 0，而畫面上的 E(V) 仍是一個看起來完全正常的
            精確數字。**少算一項而不說，比整塊不顯示嚴重得多。**
            此欄非空時後端不會寫入當日快取。
        chipsAsOf:
          type: string
          nullable: true
          description: 三大法人買賣超資料的最後日期（YYYY-MM-DD）
        revenueAsOf:
          type: string
          nullable: true
          description: >-
            最近一筆月營收所屬年月（YYYY/MM）。
            與股價、法人各自獨立顯示 —— 三個來源的最新日期不一定相同，
            合併成單一「更新時間」會蓋掉這個差異。
      required:
        - code
